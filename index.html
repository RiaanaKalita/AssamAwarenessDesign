<!DOCTYPE html>
<html lang="en">
<head>

        /* RIGID LAYOUT ARCHITECTURE */
        .app-container {
            max-w: 1280px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            flex-grow: 1;
        }
        .grid-row {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 24px;
            margin-bottom: 30px;
        }

        /* NAVIGATION BAR */
        .custom-header {
            background-color: #2b5c8f;
            color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-wrapper {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-decoration: none;
            color: #ffffff;
        }
        .nav-links {
            display: flex;
            gap: 32px;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            padding: 8px 4px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-btn:hover {
            color: #bbdefb;
        }
        .active-tab {
            border-bottom: 4px solid #ffffff;
            font-weight: 700;
        }

            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .hero-title {
            color: #ffffff;
            font-size: 30px;
            line-height: 1.3;
            margin-bottom: 16px;
        }
        .donate-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #ea8d83;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            width: 120px;
            height: 44px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .donate-btn:hover {
            background-color: #e37b70;
        }
        .hero-badge {

            right: 24px;
            bottom: 24px;
            background-color: #83bfa7;
            color: #1a202c;

            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

            flex-direction: column;
            align-items: center;

        .hub-card:hover {

            background-color: #ea8d83;
            border-radius: 2px;
            margin: 12px 0;

        .card-pill {

            background-color: rgba(255,255,255,0.6);

            background-color: #78b3c6;

            padding: 24px;
            color: #ffffff;

            padding: 6px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .quiz-option {
            display: flex;
            align-items: start;
            gap: 12px;
            padding: 10px;
            background-color: rgba(255,255,255,0.1);

            margin-bottom: 8px;

            transition: background 0.2s;
